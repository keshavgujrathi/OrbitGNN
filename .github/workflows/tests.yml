name: OrbitGNN Tests

on:
  push:
    branches: [main, real-tle-pipeline]
  pull_request:
    branches: [main, real-tle-pipeline]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Physics self-test
        run: python physics.py

      - name: Unit tests — physics, dataset, graph, model
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/test_dataset.py \
            -x

      - name: Dataset unit tests (no real benchmark required)
        run: |
          python -m pytest tests/test_dataset.py -v --tb=short \
            -k "not Integration" \
            -x

      - name: Synthetic pipeline smoke test
        run: |
          python train.py \
            --dataset synthetic \
            --epochs 2 \
            --baselines-only

  lint:
    name: Lint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff (errors only, no style enforcement)
        run: ruff check --select E9,F63,F7,F82 --no-fix .
